ctx.fillStyle='#d2ed9a';ctx.beginPath();ctx.ellipse(0,10,34,24,0,0,TAU);ctx.fill();ctx.fillStyle='#315c32';ctx.beginPath();ctx.arc(-12,7,3,0,TAU);ctx.arc(12,7,3,0,TAU);ctx.fill();ctx.strokeStyle='#244c2c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,13,13,.2,Math.PI-.2);ctx.stroke();

function draw(){ctx.save();if(portraitMode)ctx.setTransform(0,1,-1,0,700,0);if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);background();drawTrack();balls.forEach(b=>{const p=at(b.s);if(b.pop){ctx.save();ctx.globalAlpha=b.pop*2;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,BR+7*(1-b.pop/.25),0,TAU);ctx.stroke();ctx.restore()}marble(p.x,p.y,b.k)});
drawFrog();if(bombArmed){ctx.save();ctx.strokeStyle='#ffe58b';ctx.lineWidth=4;ctx.setLineDash([7,6]);ctx.beginPath();ctx.arc(CX,CY,113+Math.sin(performance.now()*.009)*5,0,TAU);ctx.stroke();ctx.restore()}shots.forEach(q=>{q.trail.forEach((p,i)=>{ctx.globalAlpha=(i+1)/q.trail.length*.22;ctx.fillStyle=palette[q.k][0];ctx.beginPath();ctx.arc(p.x,p.y,3+i*.6,0,TAU);ctx.fill()});ctx.globalAlpha=1;marble(q.x,q.y,q.k,13)});
particles.forEach(p=>{ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=palette[p.k][0];ctx.shadowColor=palette[p.k][1];ctx.shadowBlur=9;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill()});ctx.shadowBlur=0;ctx.globalAlpha=1;
floaters.forEach(f=>{ctx.globalAlpha=clamp(f.life,0,1);ctx.fillStyle='#fff1b3';ctx.font='1000 20px system-ui';ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText(f.text,f.x,f.y)});ctx.restore();
if(paused&&state==='playing'){ctx.fillStyle='#06100999';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff0c5';ctx.font='1000 42px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',CX,CY)}}
function loop(t){const dt=Math.min((t-last)/1000,.035)||0;last=t;update(dt);draw();requestAnimationFrame(loop)}
function pointer(e){const r=canvas.getBoundingClientRect(),sx=(e.clientX-r.left)*canvas.width/r.width,sy=(e.clientY-r.top)*canvas.height/r.height;return portraitMode?{x:sy,y:700-sx}:{x:sx,y:sy}}
canvas.addEventListener('pointermove',e=>{aim=pointer(e)});canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=pointer(e);aim=p;shoot(p.x,p.y)});
$('start').onclick=reset;$('restart').onclick=reset;$('swap').onclick=()=>{if(state==='playing'&&!paused){[loaded,next]=[next,loaded];tone(650,.07,'sine',.025);say('Marble swapped. Make it count!')}};$('bomb').onclick=()=>{if(state==='playing'&&!paused&&bombs>0&&!bombArmed){bombs--;bombArmed=true;hud();say('Burst armed! Tap the chain to blast a cluster.');tone(190,.16,'square',.035)}};
$('pause').onclick=()=>{if(state!=='playing')return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';say(paused?'Game paused':'The hunt continues!')};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'&&!paused){paused=true;$('pause').textContent='▶'}});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='playing'&&!paused)[loaded,next]=[next,loaded]}else if(e.key.toLowerCase()==='b')$('bomb').click();else if(e.key==='Escape')$('pause').click()});
hud();resizeGameCanvas();showOverlay('Jungle Marble','Aim with your finger and shoot matching marbles. Make groups of three or more before the chain reaches the temple gate.','▶  Begin adventure');requestAnimationFrame(loop);
})();
</script>

<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17291d"><link rel="manifest" href="manifest.webmanifest">
<title>Jungle Marble Shooter</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d15;color:#fff;font-family:system-ui}body{display:flex;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.app{width:100%;max-width:900px;height:100%;display:flex;flex-direction:column;padding:10px;gap:8px;background:linear-gradient(160deg,#263c29,#111d16)}header,.stats,.bottom,.actions{display:flex;align-items:center;justify-content:space-between;gap:9px}header{min-height:45px}.brand{font-weight:900;color:#f4ca69;font-size:clamp(16px,4vw,24px);white-space:nowrap}.stats{gap:clamp(7px,2vw,20px)}.stat{text-align:center;font-size:9px;color:#c8d4bc}.stat b{display:block;font-size:clamp(15px,3.8vw,20px);color:white}.board{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #8b774b;border-radius:14px;background:#1b2c20}canvas{width:100%;height:100%;object-fit:contain;touch-action:none}.btn{border:1px solid #a58a50;background:linear-gradient(#725b32,#45371f);color:white;border-radius:10px;font-weight:800;min-height:40px;padding:7px 12px}.icon{font-size:18px;min-width:40px}.bottom{min-height:42px}#msg{font-size:12px;color:#eadcae;flex:1}.hint{text-align:center;color:#aebca9;font-size:10px}.overlay{position:absolute;inset:0;background:#061009c9;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay.show{display:flex}.dialog{max-width:330px;background:linear-gradient(#425638,#1c2b20);border:2px solid #c5a65b;border-radius:18px;padding:22px}.dialog h2{margin:0 0 8px;color:#ffdc7c}.dialog p{font-size:14px;line-height:1.4}.dialog button{margin-top:8px}@media(orientation:landscape) and (max-height:520px){.app{padding:4px;gap:4px}.hint{display:none}.brand{font-size:16px}.stat{font-size:8px}.stat b{font-size:14px}.btn{min-height:30px;padding:4px 8px}}

/* Premium hybrid art direction */
:root{color-scheme:dark}
html,body{background:#07140f}
body{background:radial-gradient(ellipse at 50% 8%,#36563b 0,#14271c 48%,#07110d 100%);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}
.app{max-width:980px;padding:clamp(8px,2vw,18px);gap:clamp(8px,1.5vh,14px);background:linear-gradient(145deg,#263d2b99,#0b1912ee);border-inline:1px solid #b89a5940;box-shadow:0 0 70px #0009}
header{padding:7px 12px;border:1px solid #d7bd7655;border-radius:16px;background:linear-gradient(110deg,#344b32ed,#17271de8);box-shadow:inset 0 1px #ffffff24,0 8px 22px #0005}
.brand{letter-spacing:.035em;text-shadow:0 2px 12px #e6b95755;color:#ffe09a}
.stats{gap:clamp(10px,2.5vw,28px)}
.stat{letter-spacing:.13em;font-weight:800;color:#c7d5bd}
.stat b{font-variant-numeric:tabular-nums;text-shadow:0 2px 10px #fff3}
.board{border:3px solid #b99a5b;border-radius:20px;background:radial-gradient(ellipse at 50% 45%,#60784a,#203827 72%,#101d15);box-shadow:inset 0 0 0 3px #382e1d,inset 0 0 55px #07130c,0 16px 34px #0008}
canvas{filter:saturate(1.12) contrast(1.04)}
.btn{position:relative;overflow:hidden;border:1px solid #e0c17a;background:linear-gradient(180deg,#9a7940,#5d4728 55%,#3a2b1b);box-shadow:inset 0 1px #fff5,0 4px 12px #0005;color:#fff3d4;text-shadow:0 1px #0008;transition:transform .12s,filter .12s}
.btn:active{transform:translateY(2px) scale(.98);filter:brightness(1.2)}
.btn.icon{font-size:20px;border-radius:12px}
.bottom{padding:9px 12px;border:1px solid #d0b16b44;border-radius:15px;background:linear-gradient(100deg,#1c3022,#101e16);box-shadow:inset 0 1px #fff1}
#msg{font-weight:700;color:#f5d994;text-shadow:0 1px 9px #e6b95733}
.hint{letter-spacing:.035em;color:#c1d0b8;text-shadow:0 2px 6px #000}
.overlay{background:radial-gradient(ellipse at center,#102015c9,#030a06ed);backdrop-filter:blur(5px)}
.dialog{background:linear-gradient(145deg,#536c43,#263b2a 58%,#14251a);border:2px solid #d4b66d;border-radius:22px;box-shadow:0 22px 60px #000b,inset 0 1px #ffffff30;padding:clamp(22px,5vw,34px)}
.dialog h2{font-size:clamp(25px,6vw,36px);letter-spacing:.02em;text-shadow:0 3px 18px #f3c65c55}
.dialog p{color:#e0e8d5;line-height:1.55}
.dialog button{min-width:150px;min-height:48px;font-size:15px}
@media(hover:hover){.btn:hover{filter:brightness(1.16)}}
@media(orientation:landscape) and (max-height:520px){.app{padding:5px 9px}.board{border-radius:14px}header,.bottom{border-radius:11px}}
@media(prefers-reduced-motion:no-preference){.dialog{animation:arrive .35s cubic-bezier(.2,.8,.2,1)}@keyframes arrive{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}}

</style></head><body><main class="app">
<header><div class="brand">🐸 Jungle Marble</div><div class="stats"><div class="stat">SCORE<b id="score">0</b></div><div class="stat">LEVEL<b id="level">1</b></div><div class="stat">LIVES<b id="lives">♥ ♥ ♥</b></div></div><button class="btn icon" id="pause">Ⅱ</button></header>
<section class="board"><canvas id="game" width="800" height="650" aria-label="Marble shooter game"></canvas><div class="overlay show" id="overlay"><div class="dialog"><h2 id="ot">Jungle Marble</h2><p id="op">Aim with your finger and tap to shoot. Match 3 or more marbles before the chain reaches the temple hole.</p><button class="btn" id="start">▶ Play</button></div></div></section>
<footer class="bottom"><div id="msg" role="status">Ready when you are!</div><div class="actions"><button class="btn" id="swap">⇄ Swap</button><button class="btn" id="restart">↻</button></div></footer><div class="hint">Touch and drag to aim · Tap to fire · Swap changes your next marble</div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d'),W=800,H=650,CX=400,CY=325,R=17;
const cols=['#f04c45','#3999ef','#4bc66a','#f4c442','#ad65e9'],shades=['#84251f','#174e8b','#236b38','#95621c','#60338b'];
let path=[];for(let i=0;i<=1500;i++){let a=-Math.PI/2+i/1500*Math.PI*2;path.push({x:CX+310*Math.cos(a),y:CY+230*Math.sin(a)});}
let ds=[0];for(let i=1;i<path.length;i++)ds[i]=ds[i-1]+Math.hypot(path[i].x-path[i-1].x,path[i].y-path[i-1].y);const total=ds[ds.length-1];
function at(s){s=Math.max(0,Math.min(total,s));let lo=0,hi=ds.length-1;while(lo<hi){let m=(lo+hi)>>1;if(ds[m]<s)lo=m+1;else hi=m;}return path[lo];}
const rand=()=>Math.floor(Math.random()*5);let balls=[],shots=[],score=0,lives=3,level=1,loaded=0,next=1,aim={x:690,y:325},state='menu',spawn=22,clock=0,last=0,combo=0,paused=false;
function say(t){$('msg').textContent=t}function hud(){$('score').textContent=score;$('level').textContent=level;$('lives').textContent='♥ '.repeat(lives)+'♡ '.repeat(3-lives)}
function overlay(t,p,b){$('ot').textContent=t;$('op').textContent=p;$('start').textContent=b;$('overlay').classList.add('show')}
function reset(){balls=[];shots=[];score=0;lives=3;level=1;loaded=rand();next=rand();spawn=22;clock=0;combo=0;state='playing';paused=false;for(let i=0;i<13;i++)balls.push({s:i*34,k:rand()});hud();say('Match 3 or more marbles!');$('overlay').classList.remove('show');$('pause').textContent='Ⅱ'}
function marble(x,y,k,r=R){g.save();g.shadowColor='#000';g.shadowBlur=6;g.shadowOffsetY=3;let q=g.createRadialGradient(x-r*.38,y-r*.4,1,x,y,r);q.addColorStop(0,'white');q.addColorStop(.2,cols[k]);q.addColorStop(1,shades[k]);g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.shadowBlur=0;g.shadowOffsetY=0;g.strokeStyle='#ffffff70';g.stroke();g.restore()}
function shoot(x,y){if(state!=='playing'||paused)return;let a=Math.atan2(y-CY,x-CX);shots.push({x:CX+Math.cos(a)*55,y:CY+Math.sin(a)*55,vx:Math.cos(a)*620,vy:Math.sin(a)*620,k:loaded});loaded=next;next=rand()}
function match(i){let k=balls[i].k,l=i,r=i;while(l>0&&balls[l-1].k===k)l--;while(r<balls.length-1&&balls[r+1].k===k)r++;let n=r-l+1;if(n>=3){balls.splice(l,n);score+=n*100*(1+Math.min(combo,3)*.25);combo++;say(n>=4?'✨ Fantastic combo!':'💥 Marble match!')}else combo=0}
function update(dt){if(state!=='playing'||paused)return;if(spawn>0){clock+=dt;if(clock>Math.max(.42,1.1-level*.07)){clock=0;balls.push({s:0,k:rand()});spawn--}}
let speed=29+level*3;for(let i=0;i<balls.length;i++){balls[i].s+=speed*dt;if(i&&balls[i].s<balls[i-1].s+34)balls[i].s=balls[i-1].s+34}
for(let i=shots.length-1;i>=0;i--){let q=shots[i];q.x+=q.vx*dt;q.y+=q.vy*dt;let hit=-1;for(let j=0;j<balls.length;j++){let p=at(balls[j].s);if(Math.hypot(p.x-q.x,p.y-q.y)<R*2.05){hit=j;break}}if(hit>=0){balls.splice(hit,0,{s:balls[hit].s,k:q.k});for(let j=hit+1;j<balls.length;j++)balls[j].s+=34;match(hit);shots.splice(i,1)}else if(q.x<-25||q.x>W+25||q.y<-25||q.y>H+25)shots.splice(i,1)}
if(balls.some(b=>b.s>=total-20)){lives--;balls=balls.filter(b=>b.s<total-20);if(lives<=0){state='over';overlay('Game Over','Final score: '+score+'. Have another go!','↻ Play again')}else say('The chain reached the hole! One life lost.')}
if(spawn===0&&balls.length===0){level++;spawn=22+level*3;for(let i=0;i<Math.min(8,level+3);i++)balls.push({s:i*34,k:rand()});say('🏆 Level '+level+' — faster marbles!')}hud()}
function draw(){g.clearRect(0,0,W,H);let bg=g.createRadialGradient(CX,CY,20,CX,CY,520);bg.addColorStop(0,'#647a4c');bg.addColorStop(1,'#17281d');g.fillStyle=bg;g.fillRect(0,0,W,H);
for(let i=0;i<85;i++){let x=(i*137+21)%W,y=(i*83+13)%H;g.fillStyle=i%2?'#d0e59a12':'#06130d22';g.beginPath();g.ellipse(x,y,5+i%8,3+i%4,i*.8,0,7);g.fill()}
g.beginPath();path.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.lineWidth=57;g.strokeStyle='#18251b';g.stroke();g.lineWidth=46;g.strokeStyle='#9a8559';g.stroke();g.lineWidth=34;g.strokeStyle='#554b35';g.stroke();g.setLineDash([5,14]);g.lineWidth=2;g.strokeStyle='#d8c58e';g.stroke();g.setLineDash([]);
let goal=at(total);g.fillStyle='#e8b84f';g.beginPath();g.arc(goal.x,goal.y,31,0,7);g.fill();g.fillStyle='#1c120d';g.beginPath();g.arc(goal.x,goal.y,22,0,7);g.fill();g.fillStyle='#ffe6a1';g.font='bold 12px system-ui';g.textAlign='center';g.fillText('HOLE',goal.x,goal.y+4);
balls.forEach(b=>{let p=at(b.s);marble(p.x,p.y,b.k)});
g.fillStyle='#203b27';g.beginPath();g.arc(CX,CY,70,0,7);g.fill();g.strokeStyle='#c5a96b';g.lineWidth=8;g.stroke();g.fillStyle='#4b9846';g.beginPath();g.arc(CX,CY,57,0,7);g.fill();g.fillStyle='#347035';g.beginPath();g.ellipse(CX-24,CY-35,22,26,-.3,0,7);g.ellipse(CX+24,CY-35,22,26,.3,0,7);g.fill();g.fillStyle='white';g.beginPath();g.arc(CX-23,CY-38,13,0,7);g.arc(CX+23,CY-38,13,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(CX-19,CY-37,6,0,7);g.arc(CX+27,CY-37,6,0,7);g.fill();g.fillStyle='#f4aa9d';g.beginPath();g.ellipse(CX,CY+14,21,13,0,0,7);g.fill();
let a=Math.atan2(aim.y-CY,aim.x-CX);g.save();g.translate(CX,CY);g.rotate(a);g.fillStyle='#b4d77b';g.beginPath();g.roundRect(28,-13,49,26,10);g.fill();g.restore();marble(CX+Math.cos(a)*49,CY+Math.sin(a)*49,loaded,15);marble(CX,CY+108,next,12);g.fillStyle='white';g.font='bold 12px system-ui';g.fillText('NEXT',CX,CY+135);shots.forEach(q=>marble(q.x,q.y,q.k,13));
if(paused&&state==='playing'){g.fillStyle='#0009';g.fillRect(0,0,W,H);g.fillStyle='white';g.font='bold 42px system-ui';g.fillText('PAUSED',CX,CY)}}
function loop(t){let dt=Math.min((t-last)/1000,.04)||0;last=t;update(dt);draw();requestAnimationFrame(loop)}
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener('pointermove',e=>aim=pos(e));c.addEventListener('pointerdown',e=>{e.preventDefault();let p=pos(e);aim=p;shoot(p.x,p.y)});
$('start').onclick=reset;$('restart').onclick=reset;$('swap').onclick=()=>{if(state==='playing'&&!paused)[loaded,next]=[next,loaded]};$('pause').onclick=()=>{if(state!=='playing')return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';say(paused?'Game paused':'Back to it!')};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'&&!paused){paused=true;$('pause').textContent='▶'}});
hud();requestAnimationFrame(loop);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
